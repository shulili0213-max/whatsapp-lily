<body>
<div style="font-family:-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center;margin-top:38vh;color:#8a8f98;font-size:15px;line-height:1.7">
  Opening WhatsApp…<br>
  <span style="font-size:13px">If nothing happens, <a id="fallback" href="#" style="color:#16a34a">tap here</a>.</span>
</div>
<script>
(function(){
  /* ===== 配置 ===== */
  var WA_NUMBER   = '85293811744';     // Lily / Ava
  var EVENT_NAME  = 'Contact';         // TK 优化事件名（跳进 WA 才发）
  var MIN_MS      = 700;               // 少于这个毫秒数的"跳走"视为抖动，不算
  var FALLBACK_MS = 800;               // 没唤起 App 就落网页版（从 1200 缩到 800，更快）

  var T0 = Date.now();
  var fired = false;
  var goingFallback = false;
  var pending = null;   // 进入后台后的延时回传计时

  /* 从 TK 点击参数取后 5 位做短码，供人工对账 */
  function shortRef(){
    try{
      var p  = new URLSearchParams(location.search || '');
      var id = p.get('ttclid') || p.get('tkclid') || '';
      if(!id) return '';
      var s = id.replace(/[^A-Za-z0-9]/g,'').slice(-5).toUpperCase();
      return s ? ' #' + s : '';
    }catch(e){ return ''; }
  }
  var ref = shortRef();
  var msg  = 'Hi, selling my card now. Your rate?' + ref;
  var web  = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
  document.getElementById('fallback').href = web;

  // 安卓用 intent://：拉 App 更稳，且没装 WA 会自动落 wa.me（S.browser_fallback_url）
  // iOS / 桌面用 whatsapp:// 直接拉 App
  var isAndroid = /Android/i.test(navigator.userAgent);
  var deep;
  if (isAndroid) {
    deep = 'intent://send?phone=' + WA_NUMBER + '&text=' + encodeURIComponent(msg) +
           '#Intent;scheme=whatsapp;package=com.whatsapp;action=android.intent.action.SEND;' +
           'S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  } else {
    deep = 'whatsapp://send?phone=' + WA_NUMBER + '&text=' + encodeURIComponent(msg);
  }

  /* ===== 回传：页面被 WhatsApp 顶到后台、且停留满 MIN_MS 才算一次 Contact =====
     这样：真进 WA 的人一直停在后台 → 发；手抖瞬间切回 → 计时被取消 → 不发。
     解决了"快设备 700ms 内唤起导致回传漏掉"的问题。 */
  function fire(){
    if(fired) return;
    try{ if(sessionStorage.getItem('wa_fired')==='1'){ fired = true; return; } }catch(e){}
    fired = true;
    try{ sessionStorage.setItem('wa_fired','1'); }catch(e){}
    try{
      ttq.track(EVENT_NAME, {
        content_name : 'WA Chat Opened',
        content_id   : (ref.replace(/[^A-Za-z0-9]/g,'') || 'organic'),
        value        : 1,
        currency     : 'USD'
      });
    }catch(e){}
  }
  function armHidden(){            // 进入后台：启动延时，满 MIN_MS 且仍隐藏才发
    clearTimeout(pending);
    pending = setTimeout(function(){ if(document.visibilityState === 'hidden') fire(); }, MIN_MS);
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden') armHidden();   // WhatsApp 唤起，页面被顶后台
    else { clearTimeout(pending); }                          // 切回前台 = 抖动，取消
  });
  window.addEventListener('pagehide', function(){
    if(goingFallback) return;            // 我们自己跳 wa.me 的不算
    if(Date.now() - T0 >= MIN_MS) fire();   // 后台停留够久才发，瞬间关闭不误记
  });

  /* ===== 跳转 ===== */
  location.href = deep;
  setTimeout(function(){
    if(document.visibilityState === 'visible'){         // 还停在本页 = 没装 App
      goingFallback = true;
      location.href = web;
    }
  }, FALLBACK_MS);
})();
</script>
</body>
</html>
