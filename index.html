<style>

  .msg{max-width:360px;font-size:16px;line-height:1.6;}
  .spin{display:inline-block;width:24px;height:24px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px;}

<body>
  <div class="msg">
    <div><span class="spin"></span> Redirecting to WhatsApp...</div>
    <div class="status" id="status">Loading...</div>
  </div>
<script>
  var WA_PHONE = "8619083562661";
  var params = new URLSearchParams(location.search);
  var keepKeys = ["tkclid","click_id","campaign","ad_id","creative","utm_source","utm_medium","utm_campaign","utm_content","utm_term"];
  var extras = [];
  keepKeys.forEach(function(k){ if(params.has(k)) extras.push(k + "=" + params.get(k)); });
  var baseMsg = "Hi, I would like to inquire about your product.";
  var trackStr = extras.length ? " | " + extras.join("&") : "";
  var waUrl = "https://wa.me/" + WA_PHONE + "?text=" + encodeURIComponent(baseMsg + trackStr);

  var statusEl = document.getElementById('status');

  function doRedirect() {
    try {
      ttq.track('Contact');
      statusEl.className = 'status ok';
      statusEl.textContent = 'Event sent! Redirecting...';
    } catch(e) {
      statusEl.textContent = 'Tracking error: ' + e.message;
    }
    try {
      var beaconData = new URLSearchParams();
      beaconData.set('event', 'Contact');
      beaconData.set('pixel_id', typeof PIXEL_ID !== 'undefined' ? PIXEL_ID : '');
      beaconData.set('url', location.href);
      navigator.sendBeacon('https://analytics.tiktok.com/i18n/pixel/track', beaconData);
    } catch(e){}
    setTimeout(function(){
      window.location.href = waUrl;
    }, 1500);
  }

  function waitForPixel() {
    if (typeof ttq !== 'undefined' && ttq.loaded) {
      statusEl.textContent = 'Pixel ready, sending events...';
      setTimeout(doRedirect, 500);
    } else if (typeof ttq !== 'undefined') {
      statusEl.textContent = 'Waiting for pixel...';
      setTimeout(waitForPixel, 500);
    } else {
      statusEl.textContent = 'Pixel not found, redirecting anyway...';
      setTimeout(doRedirect, 2000);
    }
  }

  setTimeout(waitForPixel, 1000);
</script>
